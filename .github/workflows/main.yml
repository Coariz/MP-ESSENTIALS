name: Build with Gradle

on:
  push:
    branches: [ qwen ]
  pull_request:
    branches: [ qwen ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      # Use 'gradle' instead of './gradlew' since the wrapper is missing
      run: gradle clean build --no-daemon

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: MPEssentials
        path: build/libs/*.jar
