name: MPEssentials
version: '${version}'
main: com.mpessentials.MPEssentials
api-version: '1.21'
description: Essential SMP commands for PaperMC servers
authors:
  - MPEssentials Team
website: https://github.com/mpessentials

permissions:
  mpessentials.home:
    description: Allows players to set and use homes
    default: true
  mpessentials.home.set:
    description: Allows players to set homes
    default: true
  mpessentials.home.delete:
    description: Allows players to delete homes
    default: true
  mpessentials.tpa:
    description: Allows players to send teleport requests
    default: true
  mpessentials.tpahere:
    description: Allows players to request others to teleport to them
    default: true
  mpessentials.warp:
    description: Allows players to use warps
    default: op
  mpessentials.warp.admin:
    description: Allows admins to manage warps
    default: op
  mpessentials.kit:
    description: Allows players to claim kits
    default: true
  mpessentials.kit.admin:
    description: Allows admins to manage kits
    default: op
  mpessentials.spawn:
    description: Allows players to teleport to spawn
    default: true
  mpessentials.spawn.set:
    description: Allows admins to set spawn
    default: op
  mpessentials.spawn.admin:
    description: Allows admins to teleport other players to spawn
    default: op
  mpessentials.admin:
    description: Full admin access to all commands
    default: op
    children:
      mpessentials.home: true
      mpessentials.home.set: true
      mpessentials.home.delete: true
      mpessentials.tpa: true
      mpessentials.tpahere: true
      mpessentials.warp: true
      mpessentials.warp.admin: true
      mpessentials.kit: true
      mpessentials.kit.admin: true
      mpessentials.spawn: true
      mpessentials.spawn.set: true
      mpessentials.spawn.admin: true

commands:
  home:
    description: Teleport to your home
    usage: /<command> [name]
    aliases: [h]
  sethome:
    description: Set your home location
    usage: /<command> [name]
    aliases: [sh]
  delhome:
    description: Delete a home location
    usage: /<command> <name>
    aliases: [dh, removehome, rh]
  tpa:
    description: Request to teleport to a player
    usage: /<command> <player>
    aliases: [tpask]
  tpahere:
    description: Request a player to teleport to you
    usage: /<command> <player>
    aliases: [tpaskhere]
  tpaccept:
    description: Accept a teleport request
    usage: /<command> [player]
    aliases: [tpyes]
  tpdeny:
    description: Deny a teleport request
    usage: /<command> [player]
    aliases: [tpno]
  warp:
    description: Teleport to a warp location
    usage: /<command> [name]
  setwarp:
    description: Set a warp location
    usage: /<command> <name>
    aliases: [sw]
  delwarp:
    description: Delete a warp location
    usage: /<command> <name>
    aliases: [dw, removewarp, rw]
  kit:
    description: Claim or view kits
    usage: /<command> [name]
  givekit:
    description: Give a kit to a player
    usage: /<command> <player> <kit>
    aliases: [gk]
  spawn:
    description: Teleport to spawn
    usage: /<command> [player]
    aliases: [sp]
  setspawn:
    description: Set the spawn location
    usage: /<command>
    aliases: [ss]
